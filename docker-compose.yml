# Локальная инфраструктура для разработки: PostgreSQL + MinIO (S3).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluggi
      POSTGRES_PASSWORD: fluggi
      POSTGRES_DB: fluggi
      TZ: Asia/Tashkent
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fluggi']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: fluggi
      MINIO_ROOT_PASSWORD: fluggi-minio-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
