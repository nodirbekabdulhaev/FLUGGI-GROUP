# Production на Beget VPS. Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Переменные — из .env рядом с этим файлом (см. ENVIRONMENT.md).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluggi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-fluggi}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fluggi}']
      interval: 5s
      retries: 20

  migrate:
    build: .
    command:
      [
        'sh',
        '-c',
        'cd packages/db && node_modules/.bin/prisma migrate deploy && node_modules/.bin/tsx prisma/seed.ts',
      ]
    env_file: .env
    environment:
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    command: ['node', 'apps/api/dist/main.js']
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      retries: 5

  worker:
    build: .
    command: ['node', 'apps/api/dist/worker.js']
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command: ['sh', '-c', 'cd apps/web && node_modules/.bin/next start -p 3000']
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
